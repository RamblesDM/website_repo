    <div id="modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-[9999]">

      <div
        class="bg-main mx-2.5 sm:mx-4 rounded-2xl shadow-2xl w-[95vw] max-w-6xl max-h-[95vh] p-6 relative flex flex-col overflow-hidden">

        <canvas id="object_canvas" class="block w-full h-[70vh] max-h-[700px] rounded-xl"></canvas>

        <div id="modelLoadingOverlay"
          class="absolute inset-0 flex flex-col items-center justify-center bg-black/70 text-white rounded-xl">
          <div class="w-10 h-10 border-4 border-white/30 border-t-white rounded-full animate-spin mb-3"></div>

          <div id="modelLoadingPercent" class="text-xl font-bold">
            0%
          </div>

          <div id="modelLoadingRatio" class="text-sm text-gray-300 mt-1">
            0.0 MB / 0.0 MB
          </div>
        </div>

        <div class="overflow-y-auto w-full">
          <div class="flex flex-row gap-3">
            <h2 id="modalTitle" class="project_subtitle !mt-2"></h2>
            <h2 class="project_modal_date !mt-2 space-x-0.5"> • </h2>
            <h2 id="modalDate" class="project_modal_date !mt-2"></h2>
          </div>
          <ul id="modalTags" class="flex flex-wrap gap-2 justify-start self-start">
          </ul>
          <h2 id="modalSubtitle" class="project_subtitle_2 !mt-1 !mb-1 !px-[5px]"></h2>
          <p id="modalDesc" class="project_text !px-[5px] !mt-1 !text-left"></p>
        </div>

      </div>
    </div>
